name: Build and Release Windows EXE

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Extract version from package.json
        id: get_version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $ver = $pkg.version
          Write-Output "VERSION=v$ver" >> $env:GITHUB_ENV
          Write-Output "TAG_NAME=v$ver" >> $env:GITHUB_OUTPUT
          Write-Output "RAW_VER=$ver" >> $env:GITHUB_OUTPUT

      - name: Package Windows EXE
        run: npm run package

      - name: Compress Distribution into ZIP
        shell: pwsh
        run: |
          $zipName = "FishingJoy-${{ env.VERSION }}-Windows-x64.zip"
          tar -acf $zipName -C dist/FishingJoy-win32-x64 .
          Write-Output "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
          $size = (Get-Item $zipName).Length / 1MB
          Write-Host ("Created ZIP: {0} ({1:N2} MB)" -f $zipName, $size)

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          name: "${{ steps.get_version.outputs.TAG_NAME }} - 捕鱼达人 (Fishing Joy) · 商业街机版 (Windows EXE)"
          body: |
            ## 🌊 捕鱼达人 (Fishing Joy) ${{ steps.get_version.outputs.TAG_NAME }} - 性能优化与商业街机版 (GOD MODE)

            ### 🌟 本次构建与更新亮点 (v2.1.0)
            - 🤖 **接入 DeepSeek AI 暴躁深海 BOSS 动态对话与语音合成 (TTS)**：
              - **智能实时回怼**：调用 DeepSeek API（`deepseek-chat`），当玩家击中 BOSS 或分数突增时生成 <=15 字的高能嘲讽/暴躁/嘴硬台词。
              - **原生语音朗读**：调用 Web SpeechSynthesis API，以威严深沉的语调与凌厉快语速实时朗读。
              - **街机动感咆哮气泡**：红金发光边框 + 漫画震颤动效，支持离线高能金句库断网自愈保护。
              - **环境变量配置**：支持从 `DEEPSEEK_API_KEY` 环境变量读取 API Key。
            - 🥽 **Three.js 第一人称 3D 海底世界 (FPP 模式)**：
              - **深海体积指数雾与光影**：半球散射光 + 丁达尔神光 + 玩家潜水头灯 + 指数深度体积雾。
              - **海底地貌生态**：波纹沙丘、沉船遗迹石柱、动态摇曳海草林、上升发光气泡流。
              - **3D 游动鱼群模型**：小丑鱼、黄金巨鲨、金光蝠鲼、幽蓝水母与 14 节游龙金龙 BOSS。
              - **FPS 视角与准星射击**：屏幕中央赛博准星，鼠标 360° 自由环顾视角，WASD/空格/Shift 自由潜泳。
              - **3D 射线光线投射 (Raycaster)**：发射等离子穿甲鱼雷，命中 3D 鱼类爆破金色火花，击中 BOSS 联动 AI 吐槽。
              - **2D / 3D 随时无缝切换**：按键盘 **V** 键或点击右上角按钮随时切换视角。
            - 🎵 **高保真 BGM & 真实 SFX 系统与金币系统街机级升维重塑**。
            - 🎮 **绿色免安装**：基于 GitHub Actions 自动化编译打包，解压即玩。

            ### 🎮 快速开始
            1. 下载下方 **Assets** 中的 `${{ env.ZIP_NAME }}`。
            2. 解压后直接双击 `FishingJoy.exe` 即可畅玩！无需安装任何外部环境。
          files: |
            ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
