name: Build and Release Windows EXE

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Extract version from package.json
        id: get_version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $ver = $pkg.version
          Write-Output "VERSION=v$ver" >> $env:GITHUB_ENV
          Write-Output "TAG_NAME=v$ver" >> $env:GITHUB_OUTPUT
          Write-Output "RAW_VER=$ver" >> $env:GITHUB_OUTPUT

      - name: Package Windows EXE
        run: npm run package

      - name: Compress Distribution into ZIP
        shell: pwsh
        run: |
          $zipName = "FishingJoy-${{ env.VERSION }}-Windows-x64.zip"
          tar -acf $zipName -C dist/FishingJoy-win32-x64 .
          Write-Output "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
          $size = (Get-Item $zipName).Length / 1MB
          Write-Host ("Created ZIP: {0} ({1:N2} MB)" -f $zipName, $size)

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          name: "${{ steps.get_version.outputs.TAG_NAME }} - 捕鱼达人 (Fishing Joy) · 商业街机版 (Windows EXE)"
          body: |
            ## 🌊 捕鱼达人 (Fishing Joy) ${{ steps.get_version.outputs.TAG_NAME }} - 性能优化与商业街机版 (GOD MODE)

            ### 🌟 本次构建与更新亮点 (v2.0.2)
            - 🎵 **高保真音频与音乐系统**：
              - **轻松休闲背景音乐 (BGM)**：水下深海轻快欢快循环，支持自适应静音/音量平滑控制。
              - **全套真实打击与收获音效 (SFX)**：炮弹发射、鱼类捕获、高音阶连珠金币落袋音效。
              - **原生 UI 交互**：支持独立 BGM 与 SFX 音量滑块调节，一键静音切换，自适应破除浏览器自动播放限制。
            - 🪙 **金币视觉品质与性能升维重塑**：
              - **真·3D 金币光泽**：纠正纹理切片映射，完整还原 3D 浮雕金币金灿高光泽。
              - **二次贝塞尔抛物线飞行**：爆破向外发散缓动 -> 弧形磁吸飞入计分板 + 3D 透视距离缩放。
              - **渐变流星流光拖尾**：炽白高亮流光 + 金色渐变彗尾 + 尾部星芒微粒。
              - **终点入池吸收星芒**：飞抵计分板触发金色吸收火花与清脆连击音效。
              - **彻底消除掉帧卡顿**：重构 UI 回流（Layout Thrashing 节流），金币对象池 $O(1)$ 零 GC 回收，60 FPS 丝滑满帧。
              - **真 3D 金币暴雨**：全屏暴雨全面升级为 10 帧 3D 翻滚旋转金币精灵。
            - 🐉 **四大史诗级 BOSS 3D 视觉与骨肉动力学**：
              - 远古五爪金龙、九幽魔煞幽冥骨龙、机械泰坦终结巨鲨、深海巨妖克拉肯。
            - 🎮 **绿色免安装**：基于 GitHub Actions 自动化编译打包，解压即玩。

            ### 🎮 快速开始
            1. 下载下方 **Assets** 中的 `${{ env.ZIP_NAME }}`。
            2. 解压后直接双击 `FishingJoy.exe` 即可畅玩！无需安装任何外部环境。
          files: |
            ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
