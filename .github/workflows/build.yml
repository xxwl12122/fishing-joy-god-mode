name: Build and Release Windows EXE

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Extract version from package.json
        id: get_version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $ver = $pkg.version
          Write-Output "VERSION=v$ver" >> $env:GITHUB_ENV
          Write-Output "TAG_NAME=v$ver" >> $env:GITHUB_OUTPUT
          Write-Output "RAW_VER=$ver" >> $env:GITHUB_OUTPUT

      - name: Package Windows EXE
        run: npm run package

      - name: Compress Distribution into ZIP
        shell: pwsh
        run: |
          $zipName = "FishingJoy-${{ env.VERSION }}-Windows-x64.zip"
          tar -acf $zipName -C dist/FishingJoy-win32-x64 .
          Write-Output "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
          $size = (Get-Item $zipName).Length / 1MB
          Write-Host ("Created ZIP: {0} ({1:N2} MB)" -f $zipName, $size)

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          name: "${{ steps.get_version.outputs.TAG_NAME }} - 捕鱼达人 (Fishing Joy) · 商业街机版 (Windows EXE)"
          body: |
            ## 🌊 捕鱼达人 (Fishing Joy) ${{ steps.get_version.outputs.TAG_NAME }} - 性能优化与商业街机版 (GOD MODE)

            ### 🌟 本次构建与更新亮点 (v2.1.1)
            - ⚡ **彻底恢复并强化“无敌破解版 (GOD MODE)”一炮必死极爽体验**：
              - **2D 模式全面秒杀**：主炮子弹、贯穿激光、全屏核弹、闪电链、炸弹鱼连锁全部打满 999,999 真实伤害，包括四大史诗级 BOSS（远古金龙、机械狂鲨、深海巨妖、幽冥骨龙）在内所有鱼类 1 枪秒杀！
              - **3D 第一人称模式一炮必死**：第一人称等离子穿甲鱼雷与光线投射对 3D 鱼类及金龙 BOSS 同样实现 1 发瞬杀，告别刮痧。
            - 💰 **999,999,999 无限金币系统全维度修复与狂暴喷涌**：
              - 修复了 `updateScore` 报错中断金币粒子的问题，金币余额锁定 999,999,999+ 且只增不减（0 消耗开炮与技能）。
              - 3D 模式与 2D 街机模式金币全面同步联动，每次击杀金币漫天喷涌飞入计分板，附带屏幕震颤与 MEGA WIN 特效。
            - 🤖 **DeepSeek AI 暴躁深海 BOSS 动态对话与语音朗读持续运作**。
            - 🥽 **Three.js 第一人称 3D 海底世界 (FPP 模式) 随时无缝切换 [V]**。
            - 🎮 **绿色免安装**：基于 GitHub Actions 自动化编译打包，解压即玩。

            ### 🎮 快速开始
            1. 下载下方 **Assets** 中的 `${{ env.ZIP_NAME }}`。
            2. 解压后直接双击 `FishingJoy.exe` 即可畅玩！无需安装任何外部环境。
          files: |
            ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
